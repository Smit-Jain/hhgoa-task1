  </style>
</head>

  <div class="container">
    <img src="builder-id.png" />

    <!-- Text Cover Guesses -->

    <div class="text" style="left: 442px; top: 238px;">Name text</div>
    
    <div class="box" style="left: 440px; top: 333px; width: 340px; height: 30px;"></div>
    <div class="text" style="left: 442px; top: 333px;">Role text</div>
    
    <div class="box" style="left: 440px; top: 428px; width: 340px; height: 30px;"></div>
    <div class="text" style="left: 442px; top: 428px;">Title text</div>
    
    <div class="box" style="left: 440px; top: 523px; width: 340px; height: 30px;"></div>

  </div>
</body>
</html>
